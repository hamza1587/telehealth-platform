apiVersion: apps/v1
kind: Deployment
metadata:
  name: telehealth-platform
  namespace: telehealth
  labels:
    app: telehealth-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: telehealth-platform
  template:
    metadata:
      labels:
        app: telehealth-platform
    spec:
      containers:
        - name: telehealth-api
          image: telehealth/platform:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: telehealth-config
            - secretRef:
                name: telehealth-secrets
          env:
            - name: DOTNET_ENVIRONMENT
              value: "Production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: telehealth-platform-service
  namespace: telehealth
spec:
  selector:
    app: telehealth-platform
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telehealth-platform-hpa
  namespace: telehealth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telehealth-platform
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80