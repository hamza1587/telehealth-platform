apiVersion: apps/v1
kind: Deployment
metadata:
  name: telehealth-platform-staging
  namespace: telehealth-staging
  labels:
    app: telehealth-platform
    environment: staging
    phase: "2"
spec:
  replicas: 10
  selector:
    matchLabels:
      app: telehealth-platform
      environment: staging
  template:
    metadata:
      labels:
        app: telehealth-platform
        environment: staging
        phase: "2"
    spec:
      containers:
      - name: video-service
        image: telehealth/video-service:v2.0.0-staging
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        envFrom:
        - secretRef:
            name: telehealth-secrets-staging
        - configMapRef:
            name: telehealth-config-staging
        env:
        - name: SERVICE_NAME
          value: "video-service"
        - name: WEBRTC_PROVIDER
          value: "twilio"
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30

      - name: prescription-service
        image: telehealth/prescription-service:v2.0.0-staging
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        envFrom:
        - secretRef:
            name: telehealth-secrets-staging
        - configMapRef:
            name: telehealth-config-staging
        env:
        - name: SERVICE_NAME
          value: "prescription-service"
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30

      - name: analytics-service
        image: telehealth/analytics-service:v2.0.0-staging
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        envFrom:
        - secretRef:
            name: telehealth-secrets-staging
        - configMapRef:
            name: telehealth-config-staging
        env:
        - name: SERVICE_NAME
          value: "analytics-service"
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: telehealth-platform-staging
  namespace: telehealth-staging
spec:
  selector:
    environment: staging
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telehealth-platform-staging-hpa
  namespace: telehealth-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telehealth-platform-staging
  minReplicas: 5
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: batch/v1
kind: Job
metadata:
  name: phase2-smoke-tests
  namespace: telehealth-staging
spec:
  template:
    spec:
      containers:
      - name: smoke-test
        image: telehealth/smoke-test:v2.0.0-staging
        env:
        - name: TEST_ENVIRONMENT
          value: "staging"
        - name: API_GATEWAY_URL
          value: "http://telehealth-platform-staging:80"
      restartPolicy: Never
  backoffLimit: 4