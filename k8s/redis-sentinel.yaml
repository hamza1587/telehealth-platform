# Redis Sentinel — 1 primary + 2 replicas + 3 Sentinel nodes
# Provides automatic failover; sentinel quorum = 2

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: telehealth-redis
  namespace: telehealth
  labels:
    app: telehealth-redis
spec:
  serviceName: telehealth-redis-headless
  replicas: 3
  selector:
    matchLabels:
      app: telehealth-redis
  template:
    metadata:
      labels:
        app: telehealth-redis
    spec:
      initContainers:
        - name: config
          image: redis:7-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              REDIS_MASTER=$(redis-cli -h telehealth-redis-0.telehealth-redis-headless.telehealth.svc.cluster.local ping 2>/dev/null && echo telehealth-redis-0.telehealth-redis-headless.telehealth.svc.cluster.local || echo "")
              if [ -z "$REDIS_MASTER" ]; then
                echo "No master found, this pod is primary"
                cp /mnt/config-map/redis.conf /mnt/redis/redis.conf
              else
                echo "slaveof $REDIS_MASTER 6379" >> /mnt/redis/redis.conf
              fi
          volumeMounts:
            - name: redis-config
              mountPath: /mnt/redis
            - name: config-map
              mountPath: /mnt/config-map
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "/etc/redis/redis.conf"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-config
          emptyDir: {}
        - name: config-map
          configMap:
            name: redis-config
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telehealth-redis-sentinel
  namespace: telehealth
  labels:
    app: telehealth-redis-sentinel
spec:
  replicas: 3
  selector:
    matchLabels:
      app: telehealth-redis-sentinel
  template:
    metadata:
      labels:
        app: telehealth-redis-sentinel
    spec:
      containers:
        - name: sentinel
          image: redis:7-alpine
          command:
            - redis-sentinel
            - /etc/sentinel/sentinel.conf
          ports:
            - containerPort: 26379
              name: sentinel
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: sentinel-config
              mountPath: /etc/sentinel
      volumes:
        - name: sentinel-config
          configMap:
            name: redis-sentinel-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: telehealth
data:
  redis.conf: |
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10
    save 60 10000
    appendonly yes
    appendfsync everysec
    requirepass ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
  namespace: telehealth
data:
  sentinel.conf: |
    port 26379
    sentinel monitor telehealth-master telehealth-redis-0.telehealth-redis-headless.telehealth.svc.cluster.local 6379 2
    sentinel down-after-milliseconds telehealth-master 5000
    sentinel failover-timeout telehealth-master 60000
    sentinel parallel-syncs telehealth-master 1
---
apiVersion: v1
kind: Service
metadata:
  name: telehealth-redis-headless
  namespace: telehealth
spec:
  clusterIP: None
  selector:
    app: telehealth-redis
  ports:
    - port: 6379
      name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: telehealth-redis
  namespace: telehealth
spec:
  selector:
    app: telehealth-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
    - port: 26379
      targetPort: 26379
      name: sentinel
