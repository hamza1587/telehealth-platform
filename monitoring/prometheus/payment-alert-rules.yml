groups:
  - name: payment-processing.rules
    rules:
      - alert: PaymentFailureRate
        expr: rate(payment_status_total{status="failed"}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: High payment failure rate
          description: "{{ $value }}% of payments are failing"

      - alert: PaymentProcessingLatency
        expr: histogram_quantile(0.95, rate(payment_processing_duration_seconds_bucket[5m])) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: High payment processing latency
          description: "95th percentile payment processing time is {{ $value }} seconds"

      - alert: SuspiciousPaymentActivity
        expr: rate(suspicious_payment_attempts_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Suspicious payment activity detected
          description: "{{ $value }} suspicious payment attempts per minute"

      - alert: PaymentGatewayDown
        expr: payment_gateway_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Payment gateway is down
          description: "Payment gateway connection is unavailable"

      - alert: HighRefundRate
        expr: rate(payment_refunds_total[10m]) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: High refund rate
          description: "{{ $value }}% of payments are being refunded"

      - alert: CardTokenizationFailures
        expr: rate(card_tokenization_failures_total[5m]) > 0.01
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Card tokenization failures
          description: "{{ $value }}% of card tokenization attempts are failing"

      - alert: PCIComplianceViolation
        expr: pci_compliance_violations_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PCI compliance violation detected
          description: "PCI compliance violation reported"

  - name: payment-infrastructure.rules
    rules:
      - alert: PaymentDatabaseSlow
        expr: pg_stat_database_numbackends{datname="telehealth_platform"} > 50
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Payment database connections high
          description: "{{ $value }} active database connections"

      - alert: PaymentQueueBacklog
        expr: payment_queue_length > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Payment queue backlog
          description: "{{ $value }} payments waiting in queue"