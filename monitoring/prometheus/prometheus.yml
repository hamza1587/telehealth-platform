global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'telehealth-platform'
    static_configs:
      - targets: ['telehealth-platform-service.telehealth.svc.cluster.local:80']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter.telehealth.svc.cluster.local:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter.telehealth.svc.cluster.local:9121']

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager.telehealth.svc.cluster.local:9093

rule_files:
  - "alert-rules.yml"