groups:
  - name: phase1.mfa.alerts
    rules:
      - alert: HighMfaFailureRate
        expr: rate(mfa_verification_failures_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High MFA failure rate detected"
          description: "{{ $value }} MFA verification failures per second over the last 5 minutes"

      - alert: MfaServiceDown
        expr: up{job="telehealth-platform"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MFA service is down"
          description: "The MFA service has been down for more than 1 minute"

      - alert: SlowMfaVerification
        expr: histogram_quantile(0.95, sum(rate(mfa_verification_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MFA verification is slow"
          description: "95th percentile of MFA verification time is {{ $value }} seconds"

  - name: phase1.device.alerts
    rules:
      - alert: SuspiciousDeviceActivity
        expr: rate(device_block_events_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Suspicious device activity detected"
          description: "{{ $value }} device block events per second over the last 5 minutes"

      - alert: HighDeviceRegistrationFailures
        expr: rate(device_registration_failures_total[5m]) > 0.01
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High device registration failure rate"
          description: "{{ $value }} device registration failures per second"

  - name: phase1.consent.alerts
    rules:
      - alert: LowConsentCaptureRate
        expr: rate(consent_captures_total[10m]) < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low consent capture rate"
          description: "Only {{ $value }} consent captures per second over the last 10 minutes"

      - alert: HighConsentWithdrawalRate
        expr: rate(consent_withdrawals_total[5m]) > rate(consent_captures_total[5m]) * 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High consent withdrawal rate"
          description: "{{ $value }}% of captured consents are being withdrawn"

  - name: phase1.security.alerts
    rules:
      - alert: MultipleFailedLogins
        expr: rate(login_failures_total[5m]) > 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Multiple failed login attempts"
          description: "{{ $value }} failed login attempts per second"

      - alert: PotentialBruteForce
        expr: rate(login_failures_total[5m]) > 50
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Potential brute force attack"
          description: "{{ $value }} failed login attempts per second - possible brute force attack"