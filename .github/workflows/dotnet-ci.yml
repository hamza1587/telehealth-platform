name: .NET CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          version: ${{ env.DOTNET_VERSION }}
          include-prereleases: true

      - name: Restore dependencies
        run: dotnet restore --verbosity quiet

      - name: Build
        run: dotnet build --no-restore -p:UseSharedCompilation=false --verbosity normal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: ./**/bin/Release/

  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          version: ${{ env.DOTNET_VERSION }}
          include-prereleases: true

      - name: Restore dependencies
        run: dotnet restore --verbosity quiet

      - name: Build
        run: dotnet build --no-restore -p:UseSharedCompilation=false --verbosity normal

      - name: Run Unit Tests
        run: |
          dotnet test --no-build --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/**/coverage.cobertura.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/*.trx
            **/*.xml
            !**/bin/**
            !**/obj/**

  security:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          version: ${{ env.DOTNET_VERSION }}
          include-prereleases: true

      - name: Build
        run: dotnet build --no-restore -p:UseSharedCompilation=false --verbosity normal

      - name: Run Security Analysis
        uses: github/codeql-action/analyze@v3
        with:
          languages: csharp
          category: "/language-indexing"

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'telehealth-platform'
          path: '.'
          format: 'HTML'
          out: 'reports'
          failOnCVSS: '7'

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/

  deploy-dev:
    name: Deploy to Development
    needs: [build, test, security]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          version: ${{ env.DOTNET_VERSION }}
          include-prereleases: true

      - name: Deploy to development environment
        run: |
          echo "Deploying to development environment..."
          echo "Build version: ${{ github.sha }}"
        env:
          DEPLOY_ENVIRONMENT: development
          BUILD_VERSION: ${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging
    needs: [build, test, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          version: ${{ env.DOTNET_VERSION }}
          include-prereleases: true

      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging environment..."
          echo "Build version: ${{ github.sha }}"
        env:
          DEPLOY_ENVIRONMENT: staging
          BUILD_VERSION: ${{ github.sha }}

  notify:
    name: Notify on Failure
    needs: [build, test, security]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "🚨 CI/CD Pipeline Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🚨 CI/CD Pipeline Failed*\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Actor:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}